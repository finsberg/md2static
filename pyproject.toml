[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md2static"
version = "0.1.0"
description = "A CLI tool to convert Markdown to PDF or Image using GitHub's API"
readme = "README.md"
authors = [{ name = "Henrik Finsberg", email = "henriknf@simula.no" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "requests",
    "playwright"
]

[project.optional-dependencies]
test = ["pytest", "responses"]

[project.scripts]
md2static = "md2static.cli:main"
